[project]
name = "pacbot-client"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.1,<3",
    "websockets>=14,<18",
]

[project.optional-dependencies]
dqn = [
    "torch>=2.1,<3",
    "pacbot-rl-models",
]

[tool.uv]
package = false

[tool.uv.sources]
pacbot-rl-models = { path = "../curc-pacbot-rl/model_package" }
